# Loki 3.2 — single-binary, filesystem storage.
#
# Receives push API writes from the otel-collector's `loki` exporter
# (which translates OTLP logs into Loki streams). Grafana queries it
# directly. 24h retention is enforced via the compactor; long-term
# storage isn't a goal for the coursework demo.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Loki 3+ requires an explicit schema. tsdb + filesystem keeps the
# moving parts to one disk path; period 24h means each index file
# covers one day, aligned with retention.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  # Structured metadata is a v3 feature we don't use yet; leaving it
  # off avoids a confusing "feature not enabled" error when older
  # clients try to push it.
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 24h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 1h
  retention_delete_worker_count: 50

analytics:
  reporting_enabled: false

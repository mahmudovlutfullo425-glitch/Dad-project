# Upstream API pool. Documents the intended load-balancing policy
# (least-connections, with fail-out after 3 errors in 30s). This block
# alone would cache DNS at startup though, so the actual /api/ route
# below uses a variable in proxy_pass to force per-request resolution
# via Docker's embedded DNS — that is what round-robins across replicas.
upstream api_backend {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Health check for the gateway itself (separate from API health).
    location = /gw-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # REST API — rewrite strips the /api prefix before forwarding.
    # `set $api_upstream` + variable proxy_pass forces nginx to re-resolve
    # the `api` service name through Docker DNS on each request, so traffic
    # spreads across both replicas instead of pinning to the first.
    location /api/ {
        set $api_upstream "api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # OpenAPI assets are served at the root of the api container, expose
    # them at the same paths through the gateway so Swagger UI links work.
    location = /docs {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream/docs;
        proxy_set_header Host $host;
    }

    location = /redoc {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream/redoc;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # Everything else goes to the Next.js storefront (step 15).
    # Hostname is held in a variable so nginx defers DNS resolution to
    # request time — until the frontend container exists this route
    # returns 502, but the gateway itself still starts.
    location / {
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

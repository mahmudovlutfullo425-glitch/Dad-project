// Byte-identical copy of inventory/proto/inventory.proto so that
// both Docker build contexts can generate their own stubs without
// reaching across service boundaries. Keep these two files in sync.

syntax = "proto3";

package inventory;

service Inventory {
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);
  rpc CommitReservation(CommitRequest) returns (CommitResponse);
  rpc ReleaseReservation(ReleaseRequest) returns (ReleaseResponse);
}

message StockItem {
  int64 variant_id = 1;
  int32 quantity = 2;
}

message CheckStockRequest { repeated StockItem items = 1; }
message CheckStockResponse {
  bool all_available = 1;
  repeated StockItem available = 2;
  repeated StockItem missing = 3;
}

message ReserveStockRequest {
  string idempotency_key = 1;
  int64 user_id = 2;
  repeated StockItem items = 3;
  int32 ttl_seconds = 4;
}
message ReserveStockResponse {
  bool success = 1;
  string reservation_id = 2;
  repeated StockItem rejected = 3;
  string error = 4;
}

message CommitRequest { string reservation_id = 1; }
message CommitResponse { bool success = 1; string error = 2; }

message ReleaseRequest { string reservation_id = 1; }
message ReleaseResponse { bool success = 1; }
